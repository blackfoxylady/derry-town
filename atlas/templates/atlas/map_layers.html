{% load i18n %}{# The four layer switches: the desktop popover and the phone "Map" sheet (prefix keeps the ids apart). #}<div class="layer-rows">
<label class="layer-row"><input type="checkbox" class="layer-row__input" id="{{ prefix }}showPhotos" data-layer="photos" checked><span class="menu__box" aria-hidden="true">{% include 'atlas/icons/check.svg' %}</span><span class="layer-row__text"><b>{% trans "Photographs" %}</b><span>{% trans "Polaroids of the places with photos" %}</span></span></label>
<label class="layer-row"><input type="checkbox" class="layer-row__input" id="{{ prefix }}showNames" data-layer="names" checked><span class="menu__box" aria-hidden="true">{% include 'atlas/icons/check.svg' %}</span><span class="layer-row__text"><b>{% trans "Place names" %}</b><span>{% trans "Labels next to the numbered pins" %}</span></span></label>
<label class="layer-row"><input type="checkbox" class="layer-row__input" id="{{ prefix }}showRelief" data-layer="relief" checked><span class="menu__box" aria-hidden="true">{% include 'atlas/icons/check.svg' %}</span><span class="layer-row__text"><b>{% trans "Conceptual relief" %}</b><span>{% trans "Contour lines and spot heights" %}</span></span></label>
<label class="layer-row"><input type="checkbox" class="layer-row__input" id="{{ prefix }}showBuildings" data-layer="buildings" checked><span class="menu__box" aria-hidden="true">{% include 'atlas/icons/check.svg' %}</span><span class="layer-row__text"><b>{% trans "Illustrative buildings" %}</b><span>{% trans "Built-up tint and house footprints" %}</span></span></label>
</div>
