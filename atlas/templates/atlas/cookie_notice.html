<section class="cookie" id="cookieConsent" role="region" aria-labelledby="cookieConsentTitle" hidden>
  {% if LANGUAGE_CODE == 'ru' %}
    <h2 class="cookie__title" id="cookieConsentTitle">Файлы cookie</h2>
    <p class="cookie__text">Мы используем дополнительные файлы cookie для анализа посещаемости сайта. Они включатся только с вашего согласия.</p>
  {% else %}
    <h2 class="cookie__title" id="cookieConsentTitle">Cookies</h2>
    <p class="cookie__text">We use optional cookies to analyse site traffic. They will only be enabled with your consent.</p>
  {% endif %}
  <div class="cookie__actions">
    <button class="btn btn--secondary" type="button" data-cookie-reject>
      {% if LANGUAGE_CODE == 'ru' %}Отклонить{% else %}Reject{% endif %}
    </button>
    <button class="btn btn--secondary" type="button" data-cookie-accept>
      {% if LANGUAGE_CODE == 'ru' %}Разрешить{% else %}Allow{% endif %}
    </button>
  </div>
</section>
