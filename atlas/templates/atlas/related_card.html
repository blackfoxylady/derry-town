{% load i18n %}<li class="related__item"><a class="related-card" href="{{ r.url }}">{% include 'atlas/locator.html' with preset='card' key=r.feature.key name=r.name link=False decorative=True %}<span class="related-card__body"><span class="num num--{{ r.letter|lower }}{% if r.kind_class %} num--{{ r.kind_class }}{% endif %}" aria-hidden="true">{{ r.feature.key }}</span><span class="related-card__text"><b>{{ r.name }}</b><span class="t-meta">{{ r.kind }}{% if show_chapter and r.chapter %} · {{ r.chapter }}{% endif %}</span></span></span></a></li>
