{% load i18n %}{# The A/B/C/U key items: the strip on the map and the 2 × 2 grid in the phone sheet. #}{% for letter in 'ABC' %}<button type="button" class="key__item" aria-pressed="true" data-hide="{{ letter }}"{% if not grid %} aria-describedby="keyTip"{% endif %}><span class="key__glyph" aria-hidden="true">{% if letter == 'A' %}{% include 'atlas/icons/glyph-a.svg' %}{% elif letter == 'B' %}{% include 'atlas/icons/glyph-b.svg' %}{% else %}{% include 'atlas/icons/glyph-c.svg' %}{% endif %}</span><span class="key__label">{% if letter == 'A' %}{% trans "Named in the novel" context "confidence" %}{% elif letter == 'B' %}{% trans "Inferred" context "confidence" %}{% else %}{% trans "Proposed" context "confidence" %}{% endif %}</span><span class="key__count"></span></button><span class="key__sep" aria-hidden="true"></span>{% endfor %}<button type="button" class="key__item key__item--link" data-list="unlocated"><span class="key__glyph" aria-hidden="true">{% include 'atlas/icons/glyph-u.svg' %}</span><span class="key__label">{% trans "No location" context "confidence" %}</span><span class="key__count"></span><span class="key__go" aria-hidden="true">{% include 'atlas/icons/arrow-right.svg' %}</span></button>
