{% load atlas_tags %}{# Whole-town inset for the place panel: one frame per language, the panel crop marked in CSS. Decorative: the panel locator carries the alt text. #}{% locator 'town' as town %}{% town_marker key as mark %}{% if town and mark %}<span class="locator-town" aria-hidden="true"><img src="{{ town.url }}" width="{{ town.width }}" height="{{ town.height }}" alt="" decoding="async"><span class="locator-town__frame" style="{{ mark.style }}"></span></span>{% endif %}
