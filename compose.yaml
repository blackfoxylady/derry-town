name: derry
services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-derry}
      POSTGRES_USER: ${POSTGRES_USER:-derry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DERRY_ARTIFACT_ROOT: /app/var
      DERRY_MEDIA_ROOT: /app/media
    ports:
      - "${DERRY_BIND:-127.0.0.1}:${DERRY_PORT:-8080}:8000"
    volumes:
      - artifacts:/app/var
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/',timeout=5)"]
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 5
volumes:
  pgdata:
  artifacts:
  media:
