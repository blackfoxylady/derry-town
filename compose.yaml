name: derry
services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # derry делит 1 vCPU / 2 ГБ с продом mika: под нагрузкой страдает только derry.
    cpus: 0.3
    mem_limit: 384m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-derry}
      POSTGRES_USER: ${POSTGRES_USER:-derry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    logging: *logging
    cpus: 0.6
    mem_limit: 768m
    # Access-log пишет nginx (с User-Agent); gunicorn оставляет только ошибки.
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2",
              "--timeout", "120", "--error-logfile", "-"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DERRY_ARTIFACT_ROOT: /app/var
      DERRY_MEDIA_ROOT: /app/media
    ports:
      - "${DERRY_BIND:-127.0.0.1}:${DERRY_PORT:-8080}:8000"
    volumes:
      - artifacts:/app/var
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/',timeout=5)"]
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 5
volumes:
  pgdata:
  artifacts:
  media:
